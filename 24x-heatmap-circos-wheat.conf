# color
<colors>
    aquamarine = 137,236,218
    m_aqua     = 102,178,178
    turq       = 0,128,128
    l_teal     = 0,102,102
    teal       = 0,76,76
</colors>

# ideogram
<ideogram>

<spacing>
default = 0.005r
<pairwise ta7D ta1A>
spacing = 8r
</pairwise>
</spacing>

# Ideogram position, fill and outline
radius           = dims(image,radius) - 290p
thickness        = 60p
fill             = yes
stroke_color     = 137,236,218
stroke_thickness = 4p

# Minimum definition for ideogram labels.
show_label       = yes

# see etc/fonts.conf for list of font names
label_font       = default
label_radius     = dims(image,radius) - 100p
label_size       = 50
label_parallel   = yes

# Bands
show_bands            = yes
fill_bands            = yes
band_stroke_thickness = 2
band_stroke_color     = white
band_transparency     = 0

</ideogram>

#ticks
show_ticks          = yes
show_tick_labels    = yes

<ticks>
radius           = dims(image,radius) - 270p
color            = black
thickness        = 2p

# the tick label is derived by multiplying the tick position
# by 'multiplier' and casting it in 'format':
#
# sprintf(format,position*multiplier)
#

multiplier       = 1e-6

# %d   - integer
# %f   - float
# %.1f - float with one decimal
# %.2f - float with two decimals
#
# for other formats, see https://perldoc.perl.org/functions/sprintf.html

format           = %d

<tick>
spacing        = 10u
size           = 10p
</tick>

<tick>
spacing        = 25u
size           = 30p
show_label     = yes
label_size     = 30p
label_offset   = 30p
format         = %d
</tick>

</ticks>

karyotype   = x1-sumai3-karyotype

<image>
dir = /90daydata/oat_renewal/Ruby/circos_plot_sumai3
# dir = /mmfs1/scratch/rubylyn.infante/circos_plot_glenn
file  = 24circos-sumai3.png
# radius of inscribed circle in image
radius         = 2000p
background     = white
# by default angle=0 is at 3 o'clock position
angle_offset   = -82
</image>

chromosomes_units           = 10000000

<highlights>

<highlight>
file       = x2-subtelo-sumai3-filtered-output-100Mb
fill_color = yes  # Default fill color in case it's not defined in the file
ideogram = yes
</highlight>

</highlights>

<plots>

<plot>
type        = tile
file        = x3-centromere-sumai3-highlights
r1          = dims(image,radius) - 420p
r0          = dims(image,radius) - 480p
orientation = in
thickness   = 60p

layers_overflow = collapse
layers = 1
</plot>

<plot>
type        = heatmap
file        = x4-ncrna-sumai3-100kb-windows
r1          = dims(image,radius) - 540p
r0          = dims(image,radius) - 600p
color       = aquamarine, m_aqua, turq, l_teal, teal
min         = 0
max         = 10
thickness = 60p
</plot>

<plot>
