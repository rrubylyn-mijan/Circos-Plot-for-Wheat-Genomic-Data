r0          = dims(image,radius) - 1080p
color       = aquamarine, m_aqua, turq, l_teal, teal
min         = 0.400000
max         = 0.699800
thickness = 60p
</plot>

</plots>

<links>

<link>

ribbon = yes
flat = yes
file   = x9-collinearity-links-sumai3

radius        = dims(image,radius) - 1140p
bezier_radius = 0r

stroke_thickness = 0

<rules>
    <rule>
        condition = 1
        # use the "color=" value from the links file as the fill color
        color = eval(var(color))
    </rule>
</rules>

</link>

</links>

